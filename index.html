    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        @keyframes pulse-ring {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.9; }
            100% { transform: translate(-50%, -50%) scale(2.4); opacity: 0; }
        }

        .hotspot-dot {
            position: absolute;
            width: 22px;
            height: 22px;
            background-color: #226e01;
            border: 1px solid #dddddd;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s;
            transform: translate(-50%, -50%);
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 10px;
            font-weight: bold;
            pointer-events: auto;
            touch-action: manipulation;
        }

        /*.hotspot-dot::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            background-color: #ef4444;
            border-radius: 50%;
            animation: pulse-ring 2s infinite;
            z-index: -1;
            pointer-events: none;
        }*/

        .hotspot-dot:hover, .hotspot-dot.active {
            background-color: #226e01;
            transform: translate(-50%, -50%) scale(1.3);
            z-index: 30;
            //box-shadow: 0 0 12px rgba(239, 68, 68, 0.8), 0 0 0 3px rgba(255, 255, 255, 0.9);
        }

        /* จุดสถานะขัดข้อง (สีเหลือง) */
        .hotspot-dot.status-warning {
            background-color: #ef4444 !important;
            border-color: #ffffff !important;
            color: #f7df02 !important;
        }

        .hotspot-dot.status-warning::before {
            background-color: #ef4444 !important;
        }

        .hotspot-dot.status-warning:hover, .hotspot-dot.status-warning.active {
            background-color: #ef4444 !important;
            color: #ffffff !important;
            box-shadow: 0 0 12px rgba(234, 179, 8, 0.8), 0 0 0 3px rgba(255, 255, 255, 0.9);
        }

        .hotspot-label {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(-6px);
            background: rgba(15, 23, 42, 0.9);
            color: #ffffff;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .hotspot-dot:hover .hotspot-label, .hotspot-dot.active .hotspot-label {
            opacity: 1;
            transform: translateX(-50%) translateY(-10px);
        }

        .map-viewport { 
            cursor: grab; 
            user-select: none; 
            touch-action: none;
            overflow: hidden;
        }
        .map-viewport:active { cursor: grabbing; }
        .modal-backdrop { background-color: rgba(15, 23, 42, 0.65); backdrop-filter: blur(4px); }

        /* บังคับขยายขนาด Header และ คำอธิบาย บนหน้าจอมือถือ */
          @media (max-width: 640px) {
              /* ขยายความสูงและตัวหนังสือ Header */
              header {

              }
              header h1 {
                  font-size: 16px !important; /* ขยายชื่อระบบ */
              }
              header button, header div.w-10 {
                  width: 44px !important;   /* ขยายปุ่มแฮมเบอร์เกอร์และไอคอน */
                  height: 44px !important;
              }
              header a {
                  font-size: 14px !important; /* ขยายปุ่มขวาบน */
                  padding: 8px 12px !important;
              }

              /* ขยายกล่องคำอธิบายล่างซ้าย */
              .absolute.bottom-4 {
                  bottom: 24px !important;
                  padding: 12px 20px !important;
                  font-size: 16px !important; /* ตัวหนังสือใหญ่ชัดเจน */
                  width: 92% !important;
              }
              .absolute.bottom-4 span.w-3\.5 {
                  width: 18px !important;    /* ขยายจุดวงกลมสีเขียว/แดง */
                  height: 18px !important;
              }
          }

    { id: 22, number: "22", name: "SkyWalk (ช่วงอาคารศิริราชบำรุงเวช)", category: "จุดที่ 22", coords: { x: 31.6, y: 37.7 }, images: ["https://lh3.googleusercontent.com/d/19kftHaOnGSmv4B4QJRbuwvF7IxwDho5z", "https://lh3.googleusercontent.com/d/111-6zPPjikW6etHuBv_6s1EwA6xP3s6D"], desc: "SkyWalk (ช่วงอาคารศิริราชบำรุงเวช)", status: "normal" },

        let zoomLevel = 1;
        let panX = 0;
        let panY = 0;
        let activeBuildingId = null;

        let currentImageIndex = 0;
        let currentImageList = [];

        const mapViewport = document.getElementById('mapViewport');
        const mapContainer = document.getElementById('mapContainer');
        const hotspotContainer = document.getElementById('hotspotContainer');
        const buildingList = document.getElementById('buildingList');
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        const resultCount = document.getElementById('resultCount');
        const detailModal = document.getElementById('detailModal');
        const modalCard = document.getElementById('modalCard');

        window.addEventListener('DOMContentLoaded', () => {
            renderHotspots();
            renderBuildingList();
            initDragAndZoom();
            fetchSheetDirectly(); // เรียกดึงข้อมูลจาก Google Sheets แบบตรงๆ
        });

        // ดึงข้อมูลจาก Google Sheet ผ่าน JSONP แทรก Script
        function fetchSheetDirectly() {
            const script = document.createElement('script');
            script.src = SHEET_GVIZ_URL + '&_=' + new Date().getTime();
            document.body.appendChild(script);
        }

        // ฟังก์ชัน Callback รองรับข้อมูลที่ตอบกลับมาจาก Google Sheets
        function handleSheetData(data) {
            try {
                const rows = data.table.rows;
                rows.forEach(row => {
                    if (!row.c || !row.c[0]) return;
                    
                    const rawId = String(row.c[0].v || ''); // คอลัมน์ A (READER-xxx)
                    const statusText = row.c[2] ? String(row.c[2].v || '').trim().toLowerCase() : ''; // คอลัมน์ C (Status)
                    
                    // แปลง "READER-010" -> 10
                    const numericId = parseInt(rawId.replace(/\D/g, ''), 10);

                    const building = buildingData.find(b => b.id === numericId || b.number === String(numericId));
                    if (building) {
                        building.status = statusText;
                    }
                });

                // วาดแผนที่และรายการใหม่หลังอัปเดตสถานะ
                renderHotspots();
                renderBuildingList();
            } catch (err) {
                console.error("ประมวลผลข้อมูล Sheet ผิดพลาด:", err);
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('-translate-x-full');
        }

        function handleImageError(img) {
            img.src = "https://placehold.co/1200x675/e2e8f0/334155?text=Siriraj+Hospital+Campus+Plan+Map";
        }

        function renderHotspots() {
            hotspotContainer.innerHTML = '';
            buildingData.forEach(item => {
                const isOffline = item.status === 'offline' || item.status === 'error' || item.status === 'ขัดข้อง';
                const statusClass = isOffline ? 'status-warning' : '';

                const dot = document.createElement('div');
                dot.className = `hotspot-dot ${activeBuildingId === item.id ? 'active' : ''} ${statusClass}`;
                dot.style.left = `${item.coords.x}%`;
                dot.style.top = `${item.coords.y}%`;
                dot.setAttribute('data-id', item.id);
                dot.innerHTML = `
                    ${item.number}
                    <div class="hotspot-label">
                        ${item.name} ${isOffline ? '(ขัดข้อง)' : ''}
                    </div>
                `;
                
                dot.addEventListener('mousedown', (e) => e.stopPropagation());
                dot.addEventListener('touchstart', (e) => e.stopPropagation(), {passive: true});
                
                dot.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openModal(item.id);
                });

                hotspotContainer.appendChild(dot);
            });
        }

        function renderBuildingList() {
            const query = searchInput.value.trim().toLowerCase();
            buildingList.innerHTML = '';

            const filtered = buildingData.filter(item => {
                return item.name.toLowerCase().includes(query) || item.number.toLowerCase().includes(query);
            });

            resultCount.textContent = `พบทั้งหมด ${filtered.length} รายการ`;

            if (filtered.length === 0) {
                buildingList.innerHTML = `
                    <div class="p-6 text-center text-slate-400">
                        <i class="fa-solid fa-building-circle-xmark text-2xl mb-1 text-slate-300"></i>
                        <p class="text-xs">ไม่พบข้อมูลที่ค้นหา</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(item => {
                const isOffline = item.status === 'offline' || item.status === 'error' || item.status === 'ขัดข้อง';
                // ค้นหาบรรทัดนี้ในฟังก์ชัน renderBuildingList()
                // เดิม: const badgeColor = isOffline ? 'bg-amber-100 text-amber-700 border-amber-200' : 'bg-red-100 text-red-600 border-red-200';

                // เปลี่ยนเป็น:
                const badgeColor = isOffline ? 'bg-amber-100 text-amber-700 border-amber-200' : 'bg-emerald-100 text-emerald-700 border-emerald-200';
                
                const card = document.createElement('div');
                card.className = `p-2.5 rounded-xl border transition-all cursor-pointer flex items-center gap-2.5 ${activeBuildingId === item.id ? 'bg-emerald-50/80 border-emerald-300 shadow-sm' : 'bg-white border-slate-200/80 hover:border-emerald-300 hover:shadow-sm'}`;
                card.innerHTML = `
                    <div class="w-7 h-7 rounded-lg ${badgeColor} font-bold text-xs flex items-center justify-center flex-none border">
                        ${item.number}
                    </div>
                    <div class="flex-1 min-w-0">
                        <h4 class="font-semibold text-slate-800 text-xs sm:text-sm truncate hover:text-emerald-700">${item.name}</h4>
                        <p class="text-[10px] text-slate-500 flex items-center gap-1">
                            <span class="inline-block w-1.5 h-1.5 rounded-full ${isOffline ? 'bg-amber-500' : 'bg-emerald-500'}"></span>
                            ${item.category} ${isOffline ? '<span class="text-amber-600 font-medium">(ขัดข้อง)</span>' : ''}
                        </p>
                    </div>
                `;
                card.addEventListener('click', () => {
                    openModal(item.id);
                    centerOnDot(item.coords.x, item.coords.y);
                    if (window.innerWidth < 640) toggleSidebar();
                });
                buildingList.appendChild(card);
            });
        }

        function centerOnDot(xPercent, yPercent) {
            const mapWidth = mapContainer.offsetWidth;
            const mapHeight = mapContainer.offsetHeight;

            const targetX = (mapWidth * (xPercent / 100));
            const targetY = (mapHeight * (yPercent / 100));

            zoomLevel = 1.4;
            panX = (mapViewport.offsetWidth / 2) - targetX * zoomLevel;
            panY = (mapViewport.offsetHeight / 2) - targetY * zoomLevel;

            updateMapTransform();
        }

        function filterBuildings() {
            clearSearchBtn.classList.toggle('hidden', searchInput.value.trim().length === 0);
            renderBuildingList();
        }

        function clearSearch() {
            searchInput.value = '';
            clearSearchBtn.classList.add('hidden');
            renderBuildingList();
        }

        function openModal(id) {
            const item = buildingData.find(b => b.id === id);
            if (!item) return;

            activeBuildingId = id;
            renderHotspots();
            renderBuildingList();

            currentImageList = (item.images && item.images.length > 0) 
                ? item.images 
                : [`https://placehold.co/600x400/e2e8f0/475569?text=${encodeURIComponent(item.name)}`];
            
            currentImageIndex = 0;
            updateModalImage();

            document.getElementById('modalCategory').textContent = item.category;
            document.getElementById('modalTitle').textContent = item.name;

            const isOffline = item.status === 'offline' || item.status === 'error' || item.status === 'ขัดข้อง';
            const statusBox = isOffline 
                ? `<div class="mb-2 p-2 bg-amber-50 border border-amber-200 rounded-lg text-amber-800 text-xs flex items-center gap-2">
                    <i class="fa-solid fa-triangle-exclamation text-amber-500 text-sm"></i>
                    <div><strong>สถานะ:</strong> เครื่องทาบบัตรขัดข้อง / ไม่พร้อมใช้งาน</div>
                   </div>`
                : `<div class="mb-2 p-2 bg-emerald-50 border border-emerald-200 rounded-lg text-emerald-800 text-xs flex items-center gap-2">
                    <i class="fa-solid fa-circle-check text-emerald-500 text-sm"></i>
                    <div><strong>สถานะ:</strong> ปกติ</div>
                   </div>`;

            document.getElementById('modalDesc').innerHTML = statusBox + (item.desc || "ไม่มีรายละเอียดเพิ่มเติม");

            detailModal.classList.remove('hidden');
            setTimeout(() => {
                detailModal.classList.remove('opacity-0');
                modalCard.classList.remove('scale-95');
                modalCard.classList.add('scale-100');
            }, 10);
        }

        function updateModalImage() {
            const imgElem = document.getElementById('modalImage');
            const counterElem = document.getElementById('imageCounter');
            const prevBtn = document.getElementById('prevImgBtn');
            const nextBtn = document.getElementById('nextImgBtn');

            imgElem.src = currentImageList[currentImageIndex];
            counterElem.textContent = `${currentImageIndex + 1}/${currentImageList.length}`;

            if (currentImageList.length <= 1) {
                prevBtn.style.display = 'none';
                nextBtn.style.display = 'none';
                counterElem.style.display = 'none';
            } else {
                prevBtn.style.display = 'flex';
                nextBtn.style.display = 'flex';
                counterElem.style.display = 'block';
            }
        }

        function nextImage(e) {
            if (e) e.stopPropagation();
            if (currentImageList.length <= 1) return;
            currentImageIndex = (currentImageIndex + 1) % currentImageList.length;
            updateModalImage();
        }

        function prevImage(e) {
            if (e) e.stopPropagation();
            if (currentImageList.length <= 1) return;
            currentImageIndex = (currentImageIndex - 1 + currentImageList.length) % currentImageList.length;
            updateModalImage();
        }

        function closeModal() {
            detailModal.classList.add('opacity-0');
            modalCard.classList.remove('scale-100');
            modalCard.classList.add('scale-95');
            setTimeout(() => {
                detailModal.classList.add('hidden');
                activeBuildingId = null;
                renderHotspots();
                renderBuildingList();
            }, 300);
        }

        function initDragAndZoom() {
            let isDragging = false;
            let startX = 0, startY = 0;
            let initialPinchDistance = null;
            let initialZoom = 1;

            mapViewport.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                isDragging = true;
                startX = e.clientX - panX;
                startY = e.clientY - panY;
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                updateMapTransform();
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
            });

            mapViewport.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isDragging = true;
                    startX = e.touches[0].clientX - panX;
                    startY = e.touches[0].clientY - panY;
                } else if (e.touches.length === 2) {
                    isDragging = false;
                    initialPinchDistance = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    initialZoom = zoomLevel;
                }
            }, { passive: false });

            window.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1 && isDragging) {
                    panX = e.touches[0].clientX - startX;
                    panY = e.touches[0].clientY - startY;
                    updateMapTransform();
                } else if (e.touches.length === 2 && initialPinchDistance) {
                    e.preventDefault();
                    const currentDistance = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    const scaleFactor = currentDistance / initialPinchDistance;
                    zoomLevel = Math.min(Math.max(initialZoom * scaleFactor, 0.5), 3.0);
                    updateMapTransform();
                }
            }, { passive: false });

            window.addEventListener('touchend', (e) => {
                if (e.touches.length < 2) {
                    initialPinchDistance = null;
                }
                if (e.touches.length === 0) {
                    isDragging = false;
                }
            });

            mapViewport.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomFactor = 0.15;
                if (e.deltaY < 0) {
                    zoomLevel = Math.min(zoomLevel + zoomFactor, 3.0);
                } else {
                    zoomLevel = Math.max(zoomLevel - zoomFactor, 0.5);
                }
                updateMapTransform();
            }, { passive: false });
        }

        function zoomIn() {
            zoomLevel = Math.min(zoomLevel + 0.25, 3.0);
            updateMapTransform();
        }

        function zoomOut() {
            zoomLevel = Math.max(zoomLevel - 0.25, 0.5);
            updateMapTransform();
        }

        function resetZoom() {
            zoomLevel = 1;
            panX = 0;
            panY = 0;
            updateMapTransform();
        }

        function updateMapTransform() {
            mapContainer.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
        }
    </script>
