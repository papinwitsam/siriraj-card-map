<!DOCTYPE html>

<head>

    <title>แผนที่ตำแหน่งเครื่องทาบบัตร | โรงพยาบาลศิริราช</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Kanit', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        /* ---------- แผนที่ ---------- */
        .map-viewport { cursor: grab; user-select: none; touch-action: none; overflow: hidden; }
        .map-viewport:active { cursor: grabbing; }
        #mapImage { image-rendering: auto; }

        /* จุดทาบบัตร: ขยาย/ย่อตามการซูมของแผนที่ */
        .hotspot-dot {
            position: absolute;
            width: 20px; height: 20px;
            background-color: #15803d;
            border: 2px solid #ffffff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.35);
            transform: translate(-50%, -50%) scale(var(--inv, 1));
            transition: background-color .25s, opacity .25s, box-shadow .25s;
            z-index: 20;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 9px; font-weight: 700; line-height: 1;
            touch-action: manipulation;
        }
        .hotspot-dot:hover, .hotspot-dot.active {
            transform: translate(-50%, -50%) scale(calc(var(--inv, 1) * 1.35));
            z-index: 30;
        }
        .hotspot-dot.active { box-shadow: 0 0 0 4px rgba(22,163,74,.40), 0 2px 8px rgba(0,0,0,.4); }
        .hotspot-dot.status-warning { background-color: #ef4444; }
        .hotspot-dot.status-warning.active { box-shadow: 0 0 0 4px rgba(239,68,68,.40), 0 2px 8px rgba(0,0,0,.4); }
        .hotspot-dot.dimmed { opacity: .25; }

        .hotspot-label {
            position: absolute; bottom: 100%; left: 50%;
            transform: translateX(-50%) translateY(-6px);
            background: rgba(15, 23, 42, 0.92); color: #fff;
            padding: 3px 8px; border-radius: 6px;
            font-size: 11px; font-weight: 500; white-space: nowrap;
            pointer-events: none; opacity: 0;
            transition: opacity .2s, transform .2s;
        }
        .hotspot-dot:hover .hotspot-label, .hotspot-dot.active .hotspot-label {
            opacity: 1; transform: translateX(-50%) translateY(-9px);
        }

        /* จุดตำแหน่งของฉัน */
        .user-dot {
            position: absolute; width: 16px; height: 16px;
            background: #2563eb; border: 3px solid #fff; border-radius: 50%;
            transform: translate(-50%, -50%) scale(var(--inv, 1));
            box-shadow: 0 2px 8px rgba(37,99,235,.6);
            z-index: 40; pointer-events: none;
        }
        .user-dot::before {
            content: ''; position: absolute; inset: -3px; border-radius: 50%;
            background: rgba(37,99,235,.45);
            animation: user-pulse 1.8s ease-out infinite;
        }
        .user-dot span {
            position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
            margin-top: 4px; background: #2563eb; color: #fff;
            font-size: 10px; padding: 1px 6px; border-radius: 6px; white-space: nowrap;
        }
        @keyframes user-pulse { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(3); opacity: 0; } }

        /* ---------- การ์ดรายการ ---------- */
        .tap-card { transition: box-shadow .2s, border-color .2s, background-color .2s; }
        .tap-card.selected { border-color: #16a34a; background-color: #f0fdf4; box-shadow: 0 0 0 2px rgba(22,163,74,.25); }
        .chip-active { background-color: #15803d !important; color: #fff !important; border-color: #15803d !important; }

        .modal-backdrop { background-color: rgba(15, 23, 42, 0.65); backdrop-filter: blur(4px); }

        #toast { transition: opacity .3s, transform .3s; }

        /* ===== พื้นหลังของหน้าเว็บ =====
           สีพื้นอ่อนๆ + ลายเหลี่ยมโปร่งแสง (ดูส่วน id="bgFx" ใต้แท็ก <body>)
           อยากเข้ม/จางลง: ปรับ stop-opacity ใน <linearGradient> ของ bgFx
           อยากใช้รูปแทน: เปิดบรรทัด background-image ด้านล่าง แล้วลบ div id="bgFx" ออก */
        body {
            background-color: #f3f6f7;
            /* background-image: url('ใส่ลิงก์รูปพื้นหลังตรงนี้'); */
            /* background-size: cover; background-position: center; background-attachment: fixed; */
        }
    </style>

    <!-- กรอบเนื้อหา: บน PC จะเว้นระยะซ้าย-ขวา -->

    <!-- ส่วนบน: แผนที่ (ย่อส่วน) -->

        <!-- ปุ่มควบคุมแผนที่ -->

            <button onclick="zoomIn()" title="ขยาย" class="w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-700 flex items-center justify-center active:scale-95 transition-all"><i class="fa-solid fa-plus text-sm"></i></button>

    <script>
// URL Google Sheet ในรูปแบบ gviz/tq สำหรับดึงข้อมูลทะลุระบบ CORS
const SHEET_GVIZ_URL = 'https://docs.google.com/spreadsheets/d/1ueSuu1U0sht1I1bxVdt7ZsXLIGWjZpaBLEuESTCeOyo/gviz/tq?tqx=responseHandler:handleSheetData';

const buildingData = [
    { id: 1, number: "1", name: "ตึกชัยนาทนเรนทรานุสรณ์", category: "จุดที่ 1", coords: { x: 55.8, y: 74.3 }, images: [ "https://placehold.co/600x400/1e293b/ffffff?text=Shooting+in+Progress+1", "https://placehold.co/600x400/0f766e/ffffff?text=Shooting+in+Progress+2" ], desc: "ตึกชัยนาทนเรนทรานุสรณ์", status: "normal" },

   พิกัด GPS ของแต่ละจุด (ไม่บังคับ) — รูปแบบ  id: [ละติจูด, ลองจิจูด]
   เมื่อใส่พิกัดแล้ว ระบบจะแสดงปุ่ม "เปิดใช้งาน GPS", ระยะทาง, เรียง "ใกล้ที่สุดก่อน"
   และปุ่มนำทางจะพาไปยังพิกัดจริงบน Google Maps
   ถ้าใส่พิกัดตั้งแต่ 3 จุดขึ้นไป (ไม่อยู่ในแนวเส้นตรงเดียวกัน) ระบบจะวางจุด "คุณอยู่ที่นี่" บนแผนที่ให้อัตโนมัติ
   ตัวอย่าง:
       1: [13.7590, 100.4850],
       2: [13.7595, 100.4838],
   ===================================================================== */
const GPS_COORDS = {
    // 1: [13.0000, 100.0000],
};

buildingData.forEach(b => {
    const c = GPS_COORDS[b.id];
    b.lat = c ? c[0] : null;
    b.lng = c ? c[1] : null;
    b.distance = null;
});

/* ---------------- ตัวช่วย ---------------- */
function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}
function isOffline(item) {
    return item.status === 'offline' || item.status === 'error' || item.status === 'ขัดข้อง';
}
function hasAnyCoords() {
    return buildingData.some(b => b.lat != null && b.lng != null);
}
function formatDistance(m) {
    if (m == null) return '';
    return m < 1000 ? `${Math.round(m)} ม.` : `${(m / 1000).toFixed(1)} กม.`;
}
function navUrl(item) {
    if (item.lat != null && item.lng != null) {
        return `https://www.google.com/maps/dir/?api=1&destination=${item.lat},${item.lng}&travelmode=walking`;
    }
    return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(item.name + ' โรงพยาบาลศิริราช')}&travelmode=walking`;
}
let toastTimer = null;
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.remove('opacity-0', 'translate-y-3');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.add('opacity-0', 'translate-y-3'), 2800);
}

/* ---------------- ดึงสถานะจาก Google Sheet ---------------- */
function fetchSheetDirectly() {
    const script = document.createElement('script');
    script.src = SHEET_GVIZ_URL + '&_=' + new Date().getTime();
    document.body.appendChild(script);
}

function handleSheetData(data) {
    try {
        const rows = data.table.rows;
        rows.forEach(row => {
            if (!row.c || !row.c[0]) return;
            const rawId = String(row.c[0].v || '');                                   // คอลัมน์ A (READER-xxx)
            const statusText = row.c[2] ? String(row.c[2].v || '').trim().toLowerCase() : ''; // คอลัมน์ C (Status)
            const numericId = parseInt(rawId.replace(/\D/g, ''), 10);
            const building = buildingData.find(b => b.id === numericId || b.number === String(numericId));
            if (building) building.status = statusText;
        });
        renderAll();
    } catch (err) {
        console.error("ประมวลผลข้อมูล Sheet ผิดพลาด:", err);
    }
}

/* ---------------- แสดงผลทั้งหมด ---------------- */
function getVisible() {
    const q = searchInput.value.trim().toLowerCase();
    let list = buildingData.filter(item => {
        const matchQ = !q || item.name.toLowerCase().includes(q) || item.number.toLowerCase().includes(q) || String(item.category).toLowerCase().includes(q);
        const off = isOffline(item);
        const matchS = statusFilter === 'all' || (statusFilter === 'offline' ? off : !off);
        return matchQ && matchS;
    });
    if (sortMode === 'name') {
        list.sort((a, b) => a.name.localeCompare(b.name, 'th'));
    } else if (sortMode === 'nearest') {
        list.sort((a, b) => {
            if (a.distance == null && b.distance == null) return a.id - b.id;
            if (a.distance == null) return 1;
            if (b.distance == null) return -1;
            return a.distance - b.distance;
        });
    } else {
        list.sort((a, b) => a.id - b.id);
    }
    return list;
}

function renderAll() {
    const offCount = buildingData.filter(isOffline).length;
    document.getElementById('cntOffline').textContent = offCount;
    document.getElementById('cntNormal').textContent = buildingData.length - offCount;

    document.querySelectorAll('.filter-chip').forEach(btn => {
        btn.classList.toggle('chip-active', btn.dataset.filter === statusFilter);
    });

    const visible = getVisible();
    renderList(visible);
    renderHotspots(visible);
}

function renderList(visible) {
    resultCount.textContent = visible.length;
    buildingList.innerHTML = '';

    if (visible.length === 0) {
        buildingList.innerHTML = `
            <div class="col-span-full p-8 text-center text-slate-400">
                <i class="fa-solid fa-magnifying-glass-location text-3xl mb-2 text-slate-300"></i>
                <h3 class="font-semibold text-slate-500 text-sm">ไม่พบจุดทาบบัตรที่คุณค้นหา</h3>
                <p class="text-xs mb-3">ลองเปลี่ยนคำค้นหา หรือพิมพ์ชื่อสถานที่อื่นดูนะ</p>
                <button onclick="resetFilters()" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-medium">ล้างคำค้นหา</button>
            </div>`;
        return;
    }

    // จุดที่อยู่ใกล้ที่สุด (เมื่อมี GPS)
    let nearestId = null;
    if (userPos) {
        const withDist = buildingData.filter(b => b.distance != null);
        if (withDist.length) nearestId = withDist.reduce((m, b) => b.distance < m.distance ? b : m).id;
    }

    visible.forEach(item => {
        const off = isOffline(item);
        const first = item.images && item.images[0];
        const hasRealImg = first && !/placehold\.co/.test(first);

        const thumb = `<i class="fa-solid fa-building text-slate-300 text-3xl"></i>` +
            (hasRealImg ? `<img src="${esc(first)}" alt="" loading="lazy" class="absolute inset-0 w-full h-full object-cover" onerror="this.style.display='none'">` : '');

        let tags = '';
        if (item.id === nearestId) tags += `<span class="px-1.5 py-0.5 rounded-md bg-blue-100 text-blue-700 text-[10px] font-semibold">ใกล้ที่สุด</span>`;
        else if (item.distance != null && item.distance < 200) tags += `<span class="px-1.5 py-0.5 rounded-md bg-sky-100 text-sky-700 text-[10px] font-semibold">ใกล้มาก</span>`;

        const distHtml = item.distance != null
            ? `<span class="ml-auto text-blue-600 font-semibold text-xs whitespace-nowrap"><i class="fa-solid fa-person-walking"></i> ${formatDistance(item.distance)}</span>` : '';

        const card = document.createElement('div');
        card.id = `card-${item.id}`;
        card.dataset.id = item.id;
        card.className = `tap-card bg-white rounded-2xl border border-slate-200 overflow-hidden cursor-pointer hover:border-emerald-300 hover:shadow-md flex flex-col ${selectedId === item.id ? 'selected' : ''}`;
        card.innerHTML = `
            <div class="relative h-28 bg-slate-100 flex items-center justify-center overflow-hidden">
                ${thumb}
                <span class="absolute top-2 left-2 min-w-[26px] h-[26px] px-1.5 rounded-lg ${off ? 'bg-red-500' : 'bg-emerald-700'} text-white text-xs font-bold flex items-center justify-center shadow">${esc(item.number)}</span>
            </div>
            <div class="flex-1 p-2.5 flex flex-col gap-1">
                <h4 class="font-semibold text-slate-800 text-sm leading-snug line-clamp-2 min-h-[2.5rem]">${esc(item.name)}</h4>
                <div class="flex items-center gap-1.5 flex-wrap">
                    <span class="inline-flex items-center gap-1 text-[11px] ${off ? 'text-red-600' : 'text-emerald-700'} font-medium">
                        <span class="inline-block w-1.5 h-1.5 rounded-full ${off ? 'bg-red-500' : 'bg-emerald-500'}"></span>${off ? 'ขัดข้อง' : 'ปกติ'}
                    </span>
                    ${tags}
                    ${distHtml}
                </div>
            </div>
            <a data-act="nav" href="${esc(navUrl(item))}" target="_blank" rel="noopener noreferrer" class="py-2 border-t border-slate-100 text-xs font-medium text-blue-600 hover:bg-blue-50 flex items-center justify-center gap-1.5 transition-colors"><i class="fa-solid fa-diamond-turn-right"></i> นำทาง</a>`;

        card.addEventListener('click', (e) => {
            if (e.target.closest('[data-act="nav"]')) return; // ปล่อยให้ลิงก์นำทางทำงานตามปกติ
            selectBuilding(item.id, { center: true });
            openModal(item.id);
        });
        buildingList.appendChild(card);
    });
}

function renderHotspots(visible) {
    visible = visible || getVisible();
    const filtering = searchInput.value.trim() !== '' || statusFilter !== 'all';
    const visibleIds = new Set(visible.map(v => v.id));

    hotspotContainer.innerHTML = '';
    buildingData.forEach(item => {
        const off = isOffline(item);
        const dot = document.createElement('div');
        dot.className = `hotspot-dot ${selectedId === item.id ? 'active' : ''} ${off ? 'status-warning' : ''} ${filtering && !visibleIds.has(item.id) ? 'dimmed' : ''}`;
        dot.style.left = `${item.coords.x}%`;
        dot.style.top = `${item.coords.y}%`;
        dot.dataset.id = item.id;
        dot.innerHTML = `${esc(item.number)}<div class="hotspot-label">${esc(item.name)} ${off ? '(ขัดข้อง)' : ''}</div>`;

        dot.addEventListener('mousedown', (e) => e.stopPropagation());
        dot.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
        dot.addEventListener('click', (e) => {
            e.stopPropagation();
            selectBuilding(item.id);
            openModal(item.id);
        });
        hotspotContainer.appendChild(dot);
    });

    if (userXY && userXY[0] >= 0 && userXY[0] <= 100 && userXY[1] >= 0 && userXY[1] <= 100) {
        const u = document.createElement('div');
        u.className = 'user-dot';
        u.style.left = `${userXY[0]}%`;
        u.style.top = `${userXY[1]}%`;
        u.innerHTML = '<span>คุณอยู่ที่นี่</span>';
        hotspotContainer.appendChild(u);
    }
    updateMapTransform();
}

/* เลือกจุด: ไฮไลต์บนแผนที่และการ์ดโดยไม่ต้องวาดใหม่ทั้งหมด */
function selectBuilding(id, opts = {}) {
    selectedId = id;
    document.querySelectorAll('.tap-card').forEach(c => c.classList.toggle('selected', Number(c.dataset.id) === id));
    document.querySelectorAll('.hotspot-dot').forEach(d => d.classList.toggle('active', Number(d.dataset.id) === id));
    const item = buildingData.find(b => b.id === id);
    if (item && opts.center) centerOnDot(item.coords.x, item.coords.y);
    if (opts.scrollList) {
        const card = document.getElementById(`card-${id}`);
        if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
}

/* ---------------- ค้นหา / กรอง / เรียง ---------------- */
function filterBuildings() {
    clearSearchBtn.classList.toggle('hidden', searchInput.value.trim().length === 0);
    renderAll();
}
function clearSearch() {
    searchInput.value = '';
    clearSearchBtn.classList.add('hidden');
    renderAll();
}
function resetFilters() {
    searchInput.value = '';
    clearSearchBtn.classList.add('hidden');
    statusFilter = 'all';
    renderAll();
}
function setStatusFilter(f) {
    statusFilter = f;
    renderAll();
}
function setSort(mode) {
    if (mode === 'nearest' && !userPos) {
        document.getElementById('sortSelect').value = sortMode;
        startGPS();
        return;
    }
    sortMode = mode;
    renderAll();
}

/* ---------------- แผนที่: ขนาด / ซูม / ลาก ---------------- */
function fitMap() {
    const vw = mapViewport.clientWidth, vh = mapViewport.clientHeight;
    if (!vw || !vh) return;
    const aspect = (mapImage.naturalWidth && mapImage.naturalHeight) ? mapImage.naturalWidth / mapImage.naturalHeight : 16 / 9;
    let w = Math.min(vw - 8, (vh - 8) * aspect);
    w = Math.max(w, 120);
    baseW = w;
    baseH = w / aspect;
    mapContainer.style.width = baseW + 'px';
    mapContainer.style.height = baseH + 'px';
    updateMapTransform();
}

function handleImageError(img) {
    img.onerror = null;
    img.src = "https://placehold.co/1200x675/e2e8f0/334155?text=Siriraj+Hospital+Campus+Plan+Map";
}

function toggleMapSize() {
    mapExpanded = !mapExpanded;
    const v = mapExpanded ? 80 : 52;
    mapSection.style.height = v + 'vh';
    mapSection.style.height = v + 'dvh';
    document.getElementById('expandIcon').className = mapExpanded
        ? 'fa-solid fa-down-left-and-up-right-to-center text-xs'
        : 'fa-solid fa-up-right-and-down-left-from-center text-xs';
    fitMap();
    resetZoom();
}

function centerOnDot(xPercent, yPercent) {
    if (zoomLevel < 2) zoomLevel = 2;
    const dx = (xPercent / 100 - 0.5) * baseW;
    const dy = (yPercent / 100 - 0.5) * baseH;
    panX = -dx * zoomLevel;
    panY = -dy * zoomLevel;
    updateMapTransform();
}

function updateMapTransform() {
    mapContainer.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
}

const MIN_ZOOM = 0.6, MAX_ZOOM = 5;
function zoomIn()  { zoomLevel = Math.min(zoomLevel + 0.4, MAX_ZOOM); updateMapTransform(); }
function zoomOut() { zoomLevel = Math.max(zoomLevel - 0.4, MIN_ZOOM); updateMapTransform(); }
function resetZoom() { zoomLevel = 1; panX = 0; panY = 0; updateMapTransform(); }

function initDragAndZoom() {
    let isDragging = false;
    let startX = 0, startY = 0;
    let initialPinchDistance = null;
    let initialZoom = 1;

    mapViewport.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        isDragging = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
    });
    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updateMapTransform();
    });
    window.addEventListener('mouseup', () => { isDragging = false; });

    mapViewport.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
            isDragging = true;
            startX = e.touches[0].clientX - panX;
            startY = e.touches[0].clientY - panY;
        } else if (e.touches.length === 2) {
            isDragging = false;
            initialPinchDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            initialZoom = zoomLevel;
        }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1 && isDragging) {
            panX = e.touches[0].clientX - startX;
            panY = e.touches[0].clientY - startY;
            updateMapTransform();
        } else if (e.touches.length === 2 && initialPinchDistance) {
            e.preventDefault();
            const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            zoomLevel = Math.min(Math.max(initialZoom * (d / initialPinchDistance), MIN_ZOOM), MAX_ZOOM);
            updateMapTransform();
        }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) initialPinchDistance = null;
        if (e.touches.length === 0) isDragging = false;
    });

    // เลื่อนล้อเมาส์เหนือแผนที่ = ซูมเข้า/ออก (เลื่อนล้อที่ส่วนอื่นของหน้า = เลื่อนหน้าเว็บตามปกติ)
    mapViewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        zoomLevel = e.deltaY < 0 ? Math.min(zoomLevel + 0.2, MAX_ZOOM) : Math.max(zoomLevel - 0.2, MIN_ZOOM);
        updateMapTransform();
    }, { passive: false });
}

/* ---------------- GPS / ระยะทาง ---------------- */
function initGpsFeature() {
    if (!hasAnyCoords()) return;            // ยังไม่ได้ใส่พิกัด → ซ่อนฟีเจอร์ GPS
    document.getElementById('gpsBtn').classList.remove('hidden');
    document.getElementById('gpsBtn').classList.add('flex');
    document.getElementById('optNearest').disabled = false;
    document.getElementById('optNearest').hidden = false;
    affine = buildAffine();
}

function toggleGPS() { gpsOn ? stopGPS() : startGPS(); }

function startGPS() {
    if (!hasAnyCoords()) return;
    if (!navigator.geolocation) { showToast('อุปกรณ์นี้ไม่รองรับ GPS'); return; }
    if (gpsOn) return;
    gpsOn = true;
    firstFix = true;
    document.getElementById('gpsBtnText').textContent = 'กำลังหาตำแหน่ง...';
    watchId = navigator.geolocation.watchPosition(onPosition, onPositionError, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
}

function stopGPS() {
    if (watchId != null) navigator.geolocation.clearWatch(watchId);
    watchId = null; gpsOn = false; userPos = null; userXY = null;
    buildingData.forEach(b => b.distance = null);
    if (sortMode === 'nearest') { sortMode = 'number'; document.getElementById('sortSelect').value = 'number'; }
    document.getElementById('gpsBtnText').textContent = 'เปิดใช้งาน GPS';
    document.getElementById('locateBtn').classList.add('hidden');
    document.getElementById('legendUser').classList.add('hidden');
    document.getElementById('legendUser').classList.remove('flex');
    renderAll();
}

function onPosition(p) {
    userPos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy };
    buildingData.forEach(b => {
        b.distance = (b.lat != null && b.lng != null) ? haversine(userPos.lat, userPos.lng, b.lat, b.lng) : null;
    });
    userXY = affine ? affine(userPos.lat, userPos.lng) : null;

    document.getElementById('gpsBtnText').textContent = 'GPS เปิดอยู่ (แตะเพื่อปิด)';
    if (userXY) {
        document.getElementById('locateBtn').classList.remove('hidden');
        document.getElementById('legendUser').classList.remove('hidden');
        document.getElementById('legendUser').classList.add('flex');
    }
    if (firstFix) {
        firstFix = false;
        sortMode = 'nearest';
        document.getElementById('sortSelect').value = 'nearest';
        showToast('อัปเดตพิกัดสำเร็จ — เรียงจุดที่ใกล้คุณที่สุดแล้ว');
    }
    renderAll();
}

function onPositionError(err) {
    gpsOn = false;
    watchId = null;
    document.getElementById('gpsBtnText').textContent = 'เปิดใช้งาน GPS';
    const msg = err.code === 1 ? 'ไม่ได้รับอนุญาตให้ใช้ตำแหน่ง — โปรดอนุญาตในเบราว์เซอร์'
              : err.code === 2 ? 'ไม่สามารถระบุตำแหน่งได้ในขณะนี้'
              : 'หาตำแหน่งนานเกินไป ลองใหม่อีกครั้ง';
    showToast(msg);
}

function locateMe() {
    if (userXY) centerOnDot(userXY[0], userXY[1]);
    else startGPS();
}

function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371000, rad = Math.PI / 180;
    const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(a));
}

/* แปลงพิกัดโลก → ตำแหน่ง % บนรูปแผนที่ ด้วย affine transform (least squares) จากจุดที่มีพิกัด */
function buildAffine() {
    const pts = buildingData.filter(b => b.lat != null && b.lng != null);
    if (pts.length < 3) return null;
    const lat0 = pts.reduce((s, p) => s + p.lat, 0) / pts.length;
    const lng0 = pts.reduce((s, p) => s + p.lng, 0) / pts.length;
    const k = Math.cos(lat0 * Math.PI / 180);
    const toXY = (lat, lng) => [(lng - lng0) * k * 111320, (lat - lat0) * 110540];

    const AtA = [[0, 0, 0], [0, 0, 0], [0, 0, 0]], Atx = [0, 0, 0], Aty = [0, 0, 0];
    pts.forEach(p => {
        const [X, Y] = toXY(p.lat, p.lng);
        const r = [X, Y, 1];
        for (let i = 0; i < 3; i++) {
            for (let j = 0; j < 3; j++) AtA[i][j] += r[i] * r[j];
            Atx[i] += r[i] * p.coords.x;
            Aty[i] += r[i] * p.coords.y;
        }
    });
    const cx = solve3(AtA, Atx), cy = solve3(AtA, Aty);
    if (!cx || !cy) return null;
    return (lat, lng) => {
        const [X, Y] = toXY(lat, lng);
        return [cx[0] * X + cx[1] * Y + cx[2], cy[0] * X + cy[1] * Y + cy[2]];
    };
}

function solve3(A, b) {
    const M = A.map((row, i) => [...row, b[i]]);
    let maxAbs = 0;
    A.forEach(r => r.forEach(v => { maxAbs = Math.max(maxAbs, Math.abs(v)); }));
    for (let c = 0; c < 3; c++) {
        let piv = c;
        for (let r = c + 1; r < 3; r++) if (Math.abs(M[r][c]) > Math.abs(M[piv][c])) piv = r;
        if (Math.abs(M[piv][c]) < maxAbs * 1e-9) return null;   // จุดอยู่ในแนวเส้นตรงเดียวกัน / ข้อมูลไม่พอ
        [M[c], M[piv]] = [M[piv], M[c]];
        for (let r = c + 1; r < 3; r++) {
            const f = M[r][c] / M[c][c];
            for (let j = c; j < 4; j++) M[r][j] -= f * M[c][j];
        }
    }
    const x = [0, 0, 0];
    for (let i = 2; i >= 0; i--) {
        let s = M[i][3];
        for (let j = i + 1; j < 3; j++) s -= M[i][j] * x[j];
        x[i] = s / M[i][i];
    }
    return x;
}

/* ---------------- Modal ---------------- */
function openModal(id) {
    const item = buildingData.find(b => b.id === id);
    if (!item) return;

    currentImageList = (item.images && item.images.length > 0)
        ? item.images
        : [`https://placehold.co/600x400/e2e8f0/475569?text=${encodeURIComponent(item.name)}`];
    currentImageIndex = 0;
    updateModalImage();

    document.getElementById('modalCategory').textContent = item.category;
    document.getElementById('modalTitle').textContent = item.name;
    document.getElementById('modalNavBtn').href = navUrl(item);

    const off = isOffline(item);
    const statusBox = off
        ? `<div class="mb-2 p-2 bg-amber-50 border border-amber-200 rounded-lg text-amber-800 text-xs flex items-center gap-2">
               <i class="fa-solid fa-triangle-exclamation text-amber-500 text-sm"></i>
               <div><strong>สถานะ:</strong> เครื่องทาบบัตรขัดข้อง / ไม่พร้อมใช้งาน</div>
           </div>`
        : `<div class="mb-2 p-2 bg-emerald-50 border border-emerald-200 rounded-lg text-emerald-800 text-xs flex items-center gap-2">
               <i class="fa-solid fa-circle-check text-emerald-500 text-sm"></i>
               <div><strong>สถานะ:</strong> ปกติ</div>
           </div>`;
    const distLine = item.distance != null
        ? `<div class="mb-2 text-xs text-blue-600 font-medium"><i class="fa-solid fa-person-walking"></i> ห่างจากคุณประมาณ ${formatDistance(item.distance)}</div>` : '';

    document.getElementById('modalDesc').innerHTML = statusBox + distLine + esc(item.desc || "ไม่มีรายละเอียดเพิ่มเติม");

    detailModal.classList.remove('hidden');
    setTimeout(() => {
        detailModal.classList.remove('opacity-0');
        modalCard.classList.remove('scale-95');
        modalCard.classList.add('scale-100');
    }, 10);
}

function closeModal() {
    detailModal.classList.add('opacity-0');
    modalCard.classList.remove('scale-100');
    modalCard.classList.add('scale-95');
    setTimeout(() => detailModal.classList.add('hidden'), 300);
}
detailModal.addEventListener('click', (e) => { if (e.target === detailModal) closeModal(); });

function updateModalImage() {
    const imgElem = document.getElementById('modalImage');
    const counterElem = document.getElementById('imageCounter');
    const prevBtn = document.getElementById('prevImgBtn');
    const nextBtn = document.getElementById('nextImgBtn');

    imgElem.src = currentImageList[currentImageIndex];
    counterElem.textContent = `${currentImageIndex + 1}/${currentImageList.length}`;

    const multi = currentImageList.length > 1;
    prevBtn.style.display = multi ? 'flex' : 'none';
    nextBtn.style.display = multi ? 'flex' : 'none';
    counterElem.style.display = multi ? 'block' : 'none';
}
function nextImage(e) {
    if (e) e.stopPropagation();
    if (currentImageList.length <= 1) return;
    currentImageIndex = (currentImageIndex + 1) % currentImageList.length;
    updateModalImage();
}
function prevImage(e) {
    if (e) e.stopPropagation();
    if (currentImageList.length <= 1) return;
    currentImageIndex = (currentImageIndex - 1 + currentImageList.length) % currentImageList.length;
    updateModalImage();
}

/* ---------------- พื้นหลังเคลื่อนไหวตามการเลื่อนหน้า ---------------- */
(function initBgParallax() {
    const layers = Array.from(document.querySelectorAll('#bgFx [data-parallax]'));
    if (!layers.length || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    let cur = 0, running = false;

    function progress() {
        const max = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
        return Math.min(1, Math.max(0, window.scrollY / max));
    }
    function frame() {
        const target = progress();
        cur += (target - cur) * 0.08;                       // หน่วงให้ลื่นๆ
        const vh = window.innerHeight, vw = window.innerWidth;
        layers.forEach((l, idx) => {
            const s = parseFloat(l.dataset.parallax);
            const ty = (0.5 - cur) * 0.30 * vh * s;
            const tx = (cur - 0.5) * 0.06 * vw * s * (idx % 2 ? -1 : 1);
            l.style.transform = `translate3d(${tx.toFixed(1)}px, ${ty.toFixed(1)}px, 0)`;
        });
        if (Math.abs(target - cur) > 0.0005) requestAnimationFrame(frame); else running = false;
    }
    function kick() { if (!running) { running = true; requestAnimationFrame(frame); } }
    window.addEventListener('scroll', kick, { passive: true });
    window.addEventListener('resize', kick);
    if (window.ResizeObserver) new ResizeObserver(kick).observe(document.body);
    cur = progress(); kick();
})();
    </script>
